[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

# Single source of truth for dependency versions (PLAN.md §2). Member crates
# reference these with `<crate>.workspace = true`. A committed Cargo.lock pins the
# exact resolved versions on top of these ranges (Phase-0 gate, PLAN §7).
[workspace.dependencies]
# UI + windowing (the Phase-0 compatibility matrix)
egui         = "0.36"
egui-winit   = "0.36.1"
egui_glow    = { version = "0.36.1", features = ["winit", "links", "clipboard"] }
winit        = "0.30.13"
glutin       = "0.32.3"
glutin-winit = "0.5.0"
# Tray + global hotkey (Phase 0 shell)
tray-icon    = "0.24"
global-hotkey = "0.8"
ico          = "0.5"   # decode the embedded .ico to RGBA for tray + window icons
windows-sys  = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }
# Data layer (Phase 1)
rusqlite     = { version = "0.40", features = ["bundled"] }
chrono       = "0.4"
csv          = "1.3"
# Settings + dialogs + misc
serde        = { version = "1.0", features = ["derive"] }
toml         = "0.8"
rfd          = "0.17"
nucleo       = "0.5"
dark-light   = "3.0"

# Build-time only: stamps the icon + version metadata into the exe's Win32 resource table
# (Phase 5). Never linked into the shipped binary.
winresource  = "0.1"

# Slimmer, faster release binary — size tuning is finalised in Phase 5 but these are
# cheap to set now and keep the spike's release build honest.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
